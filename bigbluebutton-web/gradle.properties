grailsVersion=7.0.8
gradleWrapperVersion=8.14.3
groovyVersion=4.0.21
springVersion=3.5.14
org.gradle.java.enable-classpath-instrumentation=false

# Build speed tuning (analogous to the sbt .jvmopts/parallelism/caching
# changes applied to akka-bbb-apps, bbb-common-message, bbb-common-web).
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC
org.gradle.parallel=true
org.gradle.caching=true
